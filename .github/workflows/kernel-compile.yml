name: HackiOS kernel compile test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kernel-compile.yml"
      - "docs/**"
      - "sources/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hackios-kernel-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beyond2lte-compile:
    name: Exynos 9820 / SM-G975F compile-only
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      KERNEL_REPO: https://github.com/ExtremeXT/android_kernel_samsung_exynos9820.git
      KERNEL_COMMIT: 2f7b0aa3e501fabeaea679e3d1bde49a1e13be46
      DEFCONFIG: extreme_beyond2lte_defconfig
    steps:
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex git libelf-dev libssl-dev make python3 rsync zip

      - name: Checkout pinned S10+ kernel and compiler
        run: |
          git init kernel
          git -C kernel remote add origin "$KERNEL_REPO"
          git -C kernel fetch --depth=1 origin "$KERNEL_COMMIT"
          git -C kernel checkout --detach FETCH_HEAD
          test "$(git -C kernel rev-parse HEAD)" = "$KERNEL_COMMIT"
          git -C kernel submodule sync --recursive
          # KernelSU is a required submodule too: drivers/kernelsu is a symlink into it.
          git -C kernel submodule update --init --depth 1 --recursive
          test -x kernel/toolchain/clang-r416183b/bin/clang
          test -f kernel/drivers/kernelsu/Kconfig
          test -f "kernel/arch/arm64/configs/$DEFCONFIG"

      - name: Record build inputs
        run: |
          mkdir -p build-record
          {
            echo "Target: Samsung Galaxy S10+ SM-G975F (beyond2lte)"
            echo "SoC: Exynos 9820"
            echo "Architecture: arm64"
            echo "Kernel repository: $KERNEL_REPO"
            echo "Kernel commit: $KERNEL_COMMIT"
            echo "Device defconfig: $DEFCONFIG"
            kernel/toolchain/clang-r416183b/bin/clang --version
            uname -a
          } | tee build-record/BUILD-INFO.txt

      - name: Configure S10+ kernel
        working-directory: kernel
        run: |
          export PATH="$PWD/toolchain/clang-r416183b/bin:$PATH"
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang READELF="$PWD/toolchain/clang-r416183b/bin/llvm-readelf" O="$GITHUB_WORKSPACE/out" "$DEFCONFIG" extreme.config
          cp "$GITHUB_WORKSPACE/out/.config" "$GITHUB_WORKSPACE/build-record/kernel.config"

      - name: Compile kernel image and device trees
        working-directory: kernel
        run: |
          export PATH="$PWD/toolchain/clang-r416183b/bin:$PATH"
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang READELF="$PWD/toolchain/clang-r416183b/bin/llvm-readelf" O="$GITHUB_WORKSPACE/out" -j2 Image dtbs

      - name: Collect compile-only outputs
        if: success()
        run: |
          mkdir -p artifacts
          test -s out/arch/arm64/boot/Image
          cp out/arch/arm64/boot/Image artifacts/Image
          find out/arch/arm64/boot/dts -type f -name '*.dtb' -exec cp --parents {} artifacts/ \;
          cp build-record/BUILD-INFO.txt build-record/kernel.config artifacts/
          sha256sum artifacts/Image > artifacts/SHA256SUMS

      - name: Upload compile-only artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beyond2lte-kernel-compile-only
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
