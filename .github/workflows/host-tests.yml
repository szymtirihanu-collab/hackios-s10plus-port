name: Host-only checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Preflight
        run: make preflight
      - name: Unit tests
        run: make test
      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py
